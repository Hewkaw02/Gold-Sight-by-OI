name: Refresh Gold Sight price data

on:
  schedule:
    # Price refresh is source-time independent. Keep the 15-minute cadence,
    # offset from common quarter-hour marks, and use UTC for predictable scheduling.
    - cron: "7,22,37,52 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-sight-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOLD_SIGHT_DATA_ROOT: public/data
      GOLD_SIGHT_SYMBOL: GC
      TV_SOURCE_SYMBOL: GOLD.F
      TV_SOURCE_EXCHANGE: BLACKBULL
      TV_SOURCE_TIMEZONE: America/Chicago
      DISPLAY_TIMEZONE: Asia/Bangkok
      CME_TIMEZONE: America/Chicago
      RUN_LIVE_OI: "false"
      FAIL_ON_PRICE_ERROR: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/price/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r collector/price/requirements.txt

      - name: Collect closed price bars with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run collector:run; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Verify price freshness
        run: npm run check:freshness

      - name: Commit normalized price data
        shell: bash
        run: |
          git config user.name "gold-sight-bot"
          git config user.email "gold-sight-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No price data changes."
            exit 0
          fi
          git commit -m "data: refresh GC price bars"
          git push origin HEAD:${{ github.ref_name }}
