name: Collect Gold Sight data

on:
  schedule:
    - cron: "50 7 * * 1-5"
      timezone: "America/Chicago"
    - cron: "55 9 * * 1-5"
      timezone: "America/Chicago"
    - cron: "20 12 * * 1-5"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      run_oi:
        description: "Run CME Vol2Vol tenor collection"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: gold-sight-data
  cancel-in-progress: false

jobs:
  collect:
    # Use a fresh GitHub-hosted Windows VM so no local self-hosted runner is required.
    # Pin Windows 2022 because better-sqlite3 needs the compatible VS 2022 toolchain.
    # CME credentials are supplied as repository secrets and the browser session is
    # recreated for each run.
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GOLD_SIGHT_DATA_ROOT: public/data
      GOLD_SIGHT_SYMBOL: GC
      TV_SOURCE_SYMBOL: GOLD.F
      TV_SOURCE_EXCHANGE: BLACKBULL
      TV_SOURCE_TIMEZONE: America/Chicago
      DISPLAY_TIMEZONE: Asia/Bangkok
      CME_TIMEZONE: America/Chicago
      CME_STORAGE_STATE_PATH: 'C:\gold-sight-runtime\cme-storage-state.json'
      OI_TARGET_DTES: 7,15,30,60,90
      OI_P90_QUANTILE: "0.9"
      OI_MAX_GAP_TRADING_SESSIONS: "2"
      FAIL_ON_OI_ERROR: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/price/requirements.txt

      - name: Install Camoufox browser
        run: npx camoufox-js fetch

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --upgrade -r collector/price/requirements.txt

      - name: Decide whether this run includes OI
        shell: pwsh
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_RUN_OI: ${{ inputs.run_oi }}
        run: |
          $isOi = ($env:MANUAL_RUN_OI -eq 'true') -or ($env:EVENT_SCHEDULE -in @('50 7 * * 1-5', '55 9 * * 1-5', '20 12 * * 1-5'))
          if ($isOi) {
            "RUN_LIVE_OI=true" >> $env:GITHUB_ENV
            if ($env:EVENT_SCHEDULE -eq '50 7 * * 1-5') { "OI_SESSION_SLOTS=open" >> $env:GITHUB_ENV }
            elseif ($env:EVENT_SCHEDULE -eq '55 9 * * 1-5') { "OI_SESSION_SLOTS=mid" >> $env:GITHUB_ENV }
            elseif ($env:EVENT_SCHEDULE -eq '20 12 * * 1-5') { "OI_SESSION_SLOTS=close" >> $env:GITHUB_ENV }
            else { "OI_SESSION_SLOTS=close" >> $env:GITHUB_ENV }
          } else {
            "RUN_LIVE_OI=false" >> $env:GITHUB_ENV
          }

      - name: Prepare persistent CME session directory
        if: env.RUN_LIVE_OI == 'true'
        shell: pwsh
        run: |
          $directory = Split-Path -Parent $env:CME_STORAGE_STATE_PATH
          New-Item -ItemType Directory -Force -Path $directory | Out-Null

      - name: Automated CME login / cookie refresh
        if: env.RUN_LIVE_OI == 'true'
        continue-on-error: true
        env:
          CME_EMAIL: ${{ secrets.CME_EMAIL }}
          CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
          CME_HEADLESS: "true"
        run: npm run auth:cme

      - name: Collect and merge data with retry
        shell: pwsh
        env:
          CME_EMAIL: ${{ secrets.CME_EMAIL }}
          CME_PASSWORD: ${{ secrets.CME_PASSWORD }}
        run: |
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm run collector:run
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds ($attempt * 20)
            }
          }
          exit 1

      - name: Verify price freshness
        if: env.RUN_LIVE_OI != 'true'
        run: npm run check:freshness

      - name: Commit normalized data
        shell: pwsh
        run: |
          git config user.name "gold-sight-bot"
          git config user.email "gold-sight-bot@users.noreply.github.com"
          git add public/data
          if (git diff --cached --quiet) {
            exit 0
          }
          git commit -m "data: refresh GC price and OI snapshots"
          git push origin HEAD:${{ github.ref_name }}
